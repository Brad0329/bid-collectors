[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bid-collectors"
version = "1.6.0"
description = "공공기관 입찰공고/지원사업 API 통합 수집 패키지"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "beautifulsoup4>=4.12",
    "pydantic>=2.0",
    "lxml>=5.0",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "respx>=0.21",
    "ruff>=0.4",
]

# 자동 탐색은 work_log·tools_tests까지 최상위 패키지로 잡아 설치가 실패한다 — 패키지만 명시
[tool.setuptools.packages.find]
include = ["bid_collectors*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "integration: real API integration tests (deselect with '-m \"not integration\"')",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
# 복잡도 규칙(CLAUDE.md '테스트 규칙'). 켤 때(2026-09-30) 기존 위반 6건은 함수 def 줄의 `# noqa: C901`로 목록화했다 —
# 파일 단위 per-file-ignores는 그 파일의 새 함수까지 면제하므로 쓰지 않는다. 목록은 늘리지 않는다.
extend-select = ["C901"]

[tool.ruff.lint.mccabe]
max-complexity = 10
